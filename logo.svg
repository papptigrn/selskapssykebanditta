<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">

  <!-- background -->
  <rect width="1200" height="800" fill="#162033"/>

  <!-- title -->
  <text x="600" y="110"
        text-anchor="middle"
        font-family="Courier New, monospace"
        font-size="68"
        font-weight="900"
        letter-spacing="4"
        fill="#facc15"
        stroke="#0f172a"
        stroke-width="8">
    SÆLSKAPSSYKE BANDITTA
  </text>

  <!-- subtitle -->
  <text x="600" y="165"
        text-anchor="middle"
        font-family="Courier New, monospace"
        font-size="42"
        font-weight="900"
        letter-spacing="10"
        fill="#93c5fd">
    6512
  </text>

  <!-- block ground -->
  <rect x="160" y="620" width="880" height="80" fill="#14532d"/>
  <rect x="160" y="700" width="880" height="45" fill="#78350f"/>

  <!-- grass pixels -->
  <g fill="#22c55e">
    <rect x="160" y="600" width="40" height="40"/>
    <rect x="240" y="600" width="40" height="40"/>
    <rect x="360" y="600" width="40" height="40"/>
    <rect x="520" y="600" width="40" height="40"/>
    <rect x="680" y="600" width="40" height="40"/>
    <rect x="840" y="600" width="40" height="40"/>
    <rect x="1000" y="600" width="40" height="40"/>
  </g>

  <!-- LEFT RAPPER -->
  <g transform="translate(290 210)">

    <!-- head -->
    <rect x="70" y="0" width="120" height="120" fill="#6b3f22"/>

    <!-- cap -->
    <rect x="50" y="-20" width="160" height="50" fill="#111827"/>

    <!-- eyes -->
    <rect x="70" y="45" width="25" height="20" fill="#0f172a"/>
    <rect x="165" y="45" width="25" height="20" fill="#0f172a"/>

    <!-- mouth -->
    <rect x="108" y="88" width="45" height="12" fill="#facc15"/>

    <!-- body -->
    <rect x="40" y="120" width="180" height="220" fill="#facc15"/>

    <!-- shirt stripe -->
    <rect x="40" y="120" width="180" height="35" fill="#1d4ed8"/>

    <!-- logo plate -->
    <rect x="80" y="155" width="100" height="40" fill="#1d4ed8"/>

    <!-- GOMA -->
    <text x="130" y="188"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="30"
          font-weight="900"
          fill="#facc15">
      GOMA
    </text>

    <!-- sponsor -->
    <text x="130" y="248"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="18"
          font-weight="900"
          fill="#1d4ed8">
      MITTET
    </text>

    <text x="130" y="276"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="13"
          font-weight="900"
          fill="#1d4ed8">
      FRUKT
    </text>

    <text x="130" y="300"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="13"
          font-weight="900"
          fill="#1d4ed8">
      &amp; TOBAKK
    </text>

    <!-- arms -->
    <rect x="-20" y="145" width="60" height="160" fill="#facc15"/>
    <rect x="220" y="145" width="60" height="160" fill="#facc15"/>

    <!-- legs -->
    <rect x="65" y="340" width="60" height="150" fill="#1d4ed8"/>
    <rect x="135" y="340" width="60" height="150" fill="#1d4ed8"/>

    <!-- shoes -->
    <rect x="45" y="490" width="85" height="35" fill="#0f172a"/>
    <rect x="130" y="490" width="85" height="35" fill="#0f172a"/>
  </g>

  <!-- RIGHT RAPPER -->
  <g transform="translate(650 210)">

    <!-- head -->
    <rect x="70" y="0" width="120" height="120" fill="#4b2c18"/>

    <!-- cap -->
    <rect x="50" y="-20" width="160" height="50" fill="#020617"/>

    <!-- eyes -->
    <rect x="70" y="45" width="25" height="20" fill="#0f172a"/>
    <rect x="165" y="45" width="25" height="20" fill="#0f172a"/>

    <!-- mouth -->
    <rect x="108" y="88" width="45" height="12" fill="#facc15"/>

    <!-- body -->
    <rect x="40" y="120" width="180" height="220" fill="#facc15"/>

    <!-- stripe -->
    <rect x="40" y="120" width="180" height="35" fill="#1d4ed8"/>

    <!-- logo plate -->
    <rect x="80" y="155" width="100" height="40" fill="#1d4ed8"/>

    <!-- GOMA -->
    <text x="130" y="188"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="30"
          font-weight="900"
          fill="#facc15">
      GOMA
    </text>

    <!-- sponsor -->
    <text x="130" y="248"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="18"
          font-weight="900"
          fill="#1d4ed8">
      MITTET
    </text>

    <text x="130" y="276"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="13"
          font-weight="900"
          fill="#1d4ed8">
      FRUKT
    </text>

    <text x="130" y="300"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="13"
          font-weight="900"
          fill="#1d4ed8">
      &amp; TOBAKK
    </text>

    <!-- arms -->
    <rect x="-20" y="145" width="60" height="160" fill="#facc15"/>
    <rect x="220" y="145" width="60" height="160" fill="#facc15"/>

    <!-- legs -->
    <rect x="65" y="340" width="60" height="150" fill="#1d4ed8"/>
    <rect x="135" y="340" width="60" height="150" fill="#1d4ed8"/>

    <!-- shoes -->
    <rect x="45" y="490" width="85" height="35" fill="#0f172a"/>
    <rect x="130" y="490" width="85" height="35" fill="#0f172a"/>
  </g>

  <!-- pixel microphone -->
  <g transform="translate(545 520)">
    <rect x="0" y="40" width="150" height="30" fill="#94a3b8"/>
    <rect x="-35" y="20" width="60" height="70" fill="#e5e7eb"/>

    <rect x="-25" y="30" width="40" height="10" fill="#64748b"/>
    <rect x="-25" y="50" width="40" height="10" fill="#64748b"/>
    <rect x="-25" y="70" width="40" height="10" fill="#64748b"/>
  </g>

</svg>
